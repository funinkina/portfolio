intro: "350+ stars and 2K+ users across GitHub. Three worth calling out."
items:
  - name: OpenEffects
    url: https://github.com/funinkina/openeffects
    tag: Linux-native webcam effects engine
    lang: Rust
    stars: 60
    users: 2K+
    blurb: "A GTK4 app over a headless daemon with a PipeWire/GStreamer pipeline. ONNX Runtime inference dispatches to CUDA, ROCm or Vulkan for sub-50ms portrait blur, center stage, studio light and background replacement. Shipped as a Flatpak on Flathub."
  - name: DeadEnv
    url: /projects/deadenv/
    tag: CLI secrets manager
    lang: Go
    stars: 15
    blurb: "Replaces plaintext .env files with the OS keychain on macOS, Linux and Windows behind biometric auth. Exports are AES-256-GCM + Argon2id with error collapsing against oracle attacks, plus a git audit log."
  - name: Ricoh SP 200 driver
    url: /blog/reverse-engineering-a-printer-driver-for-linux/
    tag: Native CUPS driver for a Windows-only printer
    lang: C
    blurb: "Captured and decoded the printer's USB protocol from the Windows driver, then wrote a CUPS filter with JBIG1 (ITU-T T.82) compression that reconstructs the full job lifecycle and prints multi-page documents."
