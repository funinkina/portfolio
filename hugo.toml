baseURL = 'https://funinkina.com/'
title = "funinkina's corner"
enableRobotsTXT = true

[minify]
minifyOutput = true

[caches]
[caches.getresource]
dir = ":resourceDir/_gen"
maxAge = -1

[security.exec]
allow = [
    '^(dart-)?sass(-embedded)?$',
    '^go$',
    '^git$',
    '^node$',
    '^postcss$',
    '^tailwindcss$',
]

[markup.highlight]
noClasses = false
locale = 'en-us'

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[params]
author = "Aryan K."
subtitle = "Systems & backend engineer at Libra AI"
location = "Bangalore, India"
avatar = "avatar.jpg"
description = "A collection of blogs, projects and opinions by funinkina."
ShowReadingTime = true
ShowDate = true
favicon = "favicon.ico"
showAnnouncement = false
# Material Symbols icons that are injected only via JS string literals (theme
# toggle), so they can't be auto-detected from the template/content source.
extraMaterialIcons = [
    "light_mode",
    "dark_mode",
    "keyboard",
    "content_copy",
    "check",
    "close",
]

[related]
threshold = 80
includeNewer = true
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[permalinks]
blog = "/blog/:slug/"

[menu]
# [[menu.main]]
# name = "🏠 HOME"
# url = "/"
# weight = 1
[[menu.main]]
name = "Blog"
url = "/blog/"
weight = 1
[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 2
