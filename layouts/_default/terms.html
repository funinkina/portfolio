{{ partial "header.html" . }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  <p>Every tag used across posts and projects.</p>
</div>
<div class="flex flex-wrap gap-2">
  {{ range .Data.Terms.ByCount }}
  <a class="chip" href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="text-text-dim ml-1">{{ .Count }}</span></a>
  {{ end }}
</div>
{{ partial "footer.html" . }}
