{{- $h := hugo.Data.highlights -}}
<div class="highlights">
  {{- range $h.items }}
  {{- $ext := hasPrefix .url "http" }}
  <a class="highlight glass card" href="{{ .url }}"{{ if $ext }} target="_blank" rel="noopener"{{ end }}>
    <span class="tag">{{ .tag }}</span>
    <h3>{{ .name }}</h3>
    <p>{{ .blurb }}</p>
    <div class="meta">
      {{- with .lang }}<span><span class="material-symbols-outlined" aria-hidden="true">code</span>{{ . }}</span>{{ end -}}
      {{- with .stars }}<span><span class="material-symbols-outlined" aria-hidden="true">star</span>{{ . }} stars</span>{{ end -}}
      {{- with .users }}<span><span class="material-symbols-outlined" aria-hidden="true">group</span>{{ . }} users</span>{{ end -}}
    </div>
  </a>
  {{- end }}
</div>
