<div class="section-tools">
    <label class="search-box glass">
        <span class="material-symbols-outlined" aria-hidden="true">search</span>
        <input type="text" id="section-search-input" placeholder="Search {{ .Section }}…" aria-label="Search {{ .Section }}">
        <button type="button" id="section-search-clear" aria-label="Clear search" title="Clear">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
    </label>
    <button type="button" id="section-search-btn" hidden aria-hidden="true" tabindex="-1">Search</button>
    <div class="sort-group glass" role="radiogroup" aria-label="Sort {{ .Section }}">
        <label class="sort-option"><input type="radio" name="section-sort" value="date-desc" checked><span>Newest</span></label>
        <label class="sort-option"><input type="radio" name="section-sort" value="date-asc"><span>Oldest</span></label>
        <label class="sort-option"><input type="radio" name="section-sort" value="title-asc"><span>A to Z</span></label>
    </div>
</div>
